<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iComfort · Sensori</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Oswald:wght@200..700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #ffffff;
  --surface: #e7fffd;
  --border: #cacacc;

  --accent: #308b82;
  --accent-glow: rgba(62,179,168,0.4);

  --warn: #ffaa00;

  --muted: #3eb3a8;

  --mono: 'Oswald', monospace;
  --sans: 'Nunito', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 30px;
  min-height: 100vh;
  overflow-x: hidden;
}

/* SCANLINE */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,212,170,0.015) 2px,
    rgba(0,212,170,0.015) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  background: #edfffe;
}

.logo {
  font-family: var(--mono);
  font-size: 28px;
  color: var(--accent);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent-glow);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 10px var(--accent-glow); }
  50% { opacity: 0.5; box-shadow: 0 0 4px var(--accent-glow); }
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
}

#last-update {
  color: var(--muted);
  font-family: var(--mono);
  font-size: 25px;
}

/* BOTTONE RICARICA PAGINA */
.ricarica-pagina {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  background: var(--muted);
  color: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px 12px;
  cursor: pointer;
  transition: 0.2s ease;
  display: flex;
  align-items: center;
  gap: 6px;
}

.ricarica-pagina:hover {
  border-color: var(--accent);
  color: var(--bg);
  box-shadow: 2px 2px 1px var(--accent);
}

.ricarica-pagina:active {
  transform: scale(0.97);
}

/* MAIN */
main {
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.section-label {
  font-family: var(--mono);
  font-size: 16px;
  letter-spacing: 0.2em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* SENSOR GRID */

.anomaly { color: #ad0000; }
.correct { color: #3eb3a8; }

#sensor-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
}

.sensor-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 12px;
  transition: 0.2s;
}

.sensor-card:hover {
  border-color: var(--accent);
}

.anomaly-card{
  background: #ff9090;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 12px;
  transition: 0.2s;
}

.anomaly-card:hover{
  border-color:#af0000
}

.sensor-name {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
}

.anomaly-name{
  font-family: var(--mono);
  font-size: 12px;
  color: #880000;
  margin-bottom: 6px;
}

.sensor-value {
  font-family: var(--mono);
  font-size: 20px;
  /*color: #222;*/
}

.bad-values{
  font-family: var(--mono);
  font-size: 14px;
  color: #ad0000;
  margin-top: 10px;
}

/* BOTTONE TROUBLESHOOTING */
.troubleshoot {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  background: #880000;
  color: #ffacac;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px 12px;
  cursor: pointer;
  transition: 0.2s ease;
  display: flex;
  align-items: center;
  gap: 6px;
}

.troubleshoot:hover {
  border-color: #500000;
  color: var(--bg);
  box-shadow: 2px 2px 1px #500000;
}

.troubleshoot:active {
  transform: scale(0.97);
}

.error-msg {
  font-family: var(--mono);
  color: var(--warn);
}
</style>
</head>

<body>

<header>
  <div class="logo">iComfort · Live Monitor</div>
  <div class="header-right">
    <span id="last-update"></span>
    <div class="status-dot"></div>
    <button type="button" class="ricarica-pagina" id="ricarica-pagina">Reload Page</button>
  </div>
</header>

<main>

  <div>
    <div class="section-label" id="orario"></div>
    <div id="sensor-grid"></div>
    <div class="bad-values" id="bad-values"></div>
    <div id="troubleshooting"></div>
  </div>

</main>

<script>
const API_KEY  = '1CFB6C41-D487-44C8-B042-FB5B81563748';
const GUID     = 'FF4EDEB4-D5B6-4B78-A8A1-B8F95FA079D7';
const BASE_URL = 'https://api.icomfort.it';

// Bottone per ricaricare la pagina
document.getElementById("ricarica-pagina").addEventListener("click", function () {location.reload();});

/* FORMAT */
function fmtVal(v) {
  if (v === null || v === undefined) return '—';
  const n = parseFloat(v);
  if (isNaN(n)) return String(v);
  return n % 1 === 0 ? n.toFixed(0) : n.toFixed(1);
}

/* FETCH SENSORS */
async function fetchSensors() {
  const res = await fetch(`${BASE_URL}/api/Measure/GetLastMeasuresByEntity?guid=${GUID}`, {
    headers: { 'Api-Key': API_KEY }
  });

  return res.json();
}

/* RENDER SENSORS */
function renderSensors(data) {
  const grid = document.getElementById('sensor-grid');
  const list = data?.MeasuresList;
  var renderSensori = ""

  var isAnomalo = [false, false, false, false, false, false, false, false, false, false, false, false]
  var troubleshooting = false
  const valoreAnomalo = document.getElementById('bad-values');
  var stringValoreAnomalo = "";

  var orario = document.getElementById('orario')
  orario.innerHTML = "Latest Measurements (" + (list[0].LastMeasure).slice(11) + ")"

  if (!Array.isArray(list)) {

    grid.innerHTML = '<div class="error-msg">Errore dati</div>';
    console.log('API response:', data);
    return;
  } else if (list.length === 0) {

    grid.innerHTML = '<div class="error-msg">Nessuna misura disponibile</div>';
    return;
  } else {

    // If che controllano se i valori sono troppo alti/bassi e danno un'avviso in caso lo siano
    if(list[0].Value <= 3){ // NuvapIndex
      
      stringValoreAnomalo += "<br>(NuvapIndex) The Nuvap index value is too low; the air is polluted and could cause problems such as headaches, fatigue, irritation of the respiratory tract, and reduced environmental comfort."
      isAnomalo[0] = true
    }

    if(list[1].Value < 980){ // Pressione
      
      stringValoreAnomalo += "<br>(Pressure) Excessively low pressure values can cause issues such as headaches, fatigue, joint pain, and increased sensitivity to weather changes."
      isAnomalo[1] = true
    } else if (list[1].Value > 1030){

      stringValoreAnomalo += "<br>(Pressure) Excessively high pressure values can cause issues such as headaches, fatigue, and a feeling of stuffy or dry air."
      isAnomalo[1] = true
    }

    if(list[2].Value > 2000){ // CO2

      stringValoreAnomalo += "<br>(CO2) Excessively high CO2 levels indicate poor ventilation and may cause issues such as headaches, drowsiness, dizziness, reduced concentration, and confusion."
      isAnomalo[2] = true
    }

    if(list[3].Value > 50){ // PM10

      stringValoreAnomalo += "<br>(PM10) Excessively high PM10 levels indicate that the air is polluted and may cause issues such as irritation of the respiratory tract, coughing, and disorders affecting the lungs and heart."
      isAnomalo[3] = true
    }

    if(list[4].Value > 15){ // PM25

      stringValoreAnomalo += "<br>(PM25) Excessively high PM25 levels indicate that the air is polluted and may cause issues such as pulmonary inflammation, worsening of asthma, and cardiovascular problems."
      isAnomalo[4] = true
    }

    if(list[5].Value > 20){ // PM1

      stringValoreAnomalo += "<br>(PM1) Excessively high PM1 levels indicate that the air is polluted and may cause issues such as deep inflammation of the respiratory tract, lung irritation, and possible effects on the cardiovascular system."
      isAnomalo[5] = true
    }

    if(list[6].Value > 1000){ //VOC

      stringValoreAnomalo += "<br>(VOC) Excessively high VOC levels indicate that the air is polluted and may cause issues such as headaches, fatigue, irritation of the eyes and respiratory tract, and nausea."
      isAnomalo[6] = true
    }

    if(list[7].Value > 2000){ //CO2 Equivalent

      stringValoreAnomalo += "<br>(CO2 Equivalent) Excessively high CO2 equivalent values can cause issues such as headaches, drowsiness, dizziness, reduced concentration, and confusion."
      isAnomalo[7] = true
    }

    if(list[8].Value < 30){ //Umidità

      stringValoreAnomalo += "<br>(Humidity) Excessively low humidity values can cause issues such as dry skin, irritation to the eyes and respiratory tract, and general discomfort."
      isAnomalo[8] = true
    } else if(list[8].Value > 60){

      stringValoreAnomalo += "<br>(Humidity) Excessively high humidity values can cause issues such as a feeling of heavy air, discomfort, fatigue, and an increased risk of mold and poor indoor air quality."
      isAnomalo[8] = true
    }

    if(list[9].Value < 0){ //temp2

      stringValoreAnomalo += "<br>(temp2) Excessively low temperature values can cause a sensation of intense cold, a risk of hypothermia in case of prolonged exposure, and general discomfort."
      isAnomalo[9] = true
    } else if(list[9].Value > 35){

      stringValoreAnomalo += "<br>(temp2) Excessively high temperature values can cause a risk of dehydration, heatstroke, and severe thermal stress in case of prolonged exposure."
      isAnomalo[9] = true
    }

    if(list[10].Value < 18){ //Temperature

      stringValoreAnomalo += "<br>(Temperature) Excessively low temperature values can cause a feeling of cold, discomfort, muscle stiffness, and reduced environmental comfort."
      isAnomalo[10] = true
    } else if(list[10].Value > 26){

      stringValoreAnomalo += "<br>(Temperature) Excessively high temperature values can cause a feeling of heat, fatigue, dehydration, and reduced concentration."
      isAnomalo[10] = true
    }

    if(list[11].Value == 1){ //Led_Event

      stringValoreAnomalo += "<br>(Led_Event) A device reporting event is active; it may indicate a warning, error, or alarm condition that should be checked in the system."
      isAnomalo[11] = true
    }



    // Scrive l'avviso (il valore di stringValoreAnomalo) all'interno dell'HTML
    valoreAnomalo.innerHTML = stringValoreAnomalo

    // Loop che scrive il render di ogni singolo sensore all'interno di renderSensori e cambia il colore del testo in base al valore (Se è corretto o anomalo)
    for(i = 0; i < list.length; i++){

      if(!isAnomalo[i]){

        renderSensori += `<div class="correct sensor-card">
        <div class="sensor-name">${list[i].EventName ?? '—'}</div>
        <div class="sensor-value">${list[i].Value+" "+list[i].Unity}</div></div>`
      } else {

        renderSensori += `<div class="anomaly anomaly-card">
        <div class="anomaly-name">${list[i].EventName ?? '—'}</div>
        <div class="sensor-value">${list[i].Value+" "+list[i].Unity}</div></div>`

        if(!troubleshooting){

          document.getElementById('troubleshooting').innerHTML = `<br><button class="troubleshoot" onclick='window.location.href="https://carear.app/#/i/43r3xi8beek"''>START TROUBLESHOOTING</button>`
          troubleshooting = true
        }
      }
    }
    // Scrive il codice per renderizzare i sensori all'interno dell'HTML
    grid.innerHTML = renderSensori;
  }
}

/* INIT */
window.addEventListener('DOMContentLoaded', async () => {
  try {
    const sensors = await fetchSensors();
    renderSensors(sensors);

    document.getElementById('last-update').textContent =
    'Updated at ' + new Date().toLocaleTimeString('it-IT', {
    hour:'2-digit',
    minute:'2-digit'
    });

  } catch (e) {
    console.error(e);
  }
});
</script>

</body>
</html>
